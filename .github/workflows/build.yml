name: Compilar Excellecu

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # para publicar la release cuando se sube una etiqueta v*

jobs:
  # Comprueba que el motor en C++ da lo mismo que el prototipo web
  motor:
    name: Motor (C++ frente a la versión web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comparar
        run: |
          node tests/run_js.mjs out
          g++ -std=c++17 -O2 -I Source -o compare_cpp tests/compare_cpp.cpp
          ./compare_cpp out
          node tests/compare.mjs out

  build:
    name: ${{ matrix.name }}
    needs: motor
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: ''
          - name: macOS
            os: macos-latest
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
          - name: Linux
            os: ubuntu-22.04
            cmake_args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb

      - name: Configurar
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Compilar
        shell: bash
        run: cmake --build build --config Release --target Excellecu_All --parallel 4

      - name: Motor con Accelerate frente al portable, y CPU de los dos (macOS)
        if: runner.os == 'macOS'
        run: |
          clang++ -std=c++17 -O2 -I Source tests/fft_check.cpp -o fft_portable
          clang++ -std=c++17 -O2 -DEX_USE_ACCELERATE -I Source tests/fft_check.cpp -framework Accelerate -o fft_accel
          ./fft_portable && ./fft_accel
          clang++ -std=c++17 -O2 -I Source tests/engine_ref.cpp -o ref_portable
          clang++ -std=c++17 -O2 -DEX_USE_ACCELERATE -I Source tests/engine_ref.cpp -framework Accelerate -o ref_accel
          ./ref_portable ref.bin
          ./ref_accel out.bin ref.bin
          clang++ -std=c++17 -O3 -I Source tests/bench_engine.cpp -o bench_portable
          clang++ -std=c++17 -O3 -DEX_USE_ACCELERATE -I Source tests/bench_engine.cpp -framework Accelerate -o bench_accel
          echo "Portable:" && ./bench_portable && echo "Accelerate:" && ./bench_accel

      - name: Prueba de humo (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --target ex_smoke --parallel 4
          xvfb-run -a ./build/ex_smoke_artefacts/Release/ex_smoke smoke-out

      - name: Prueba del prototipo web en Chrome (Linux)
        if: runner.os == 'Linux'
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          node tests/web_ui.mjs web/eq-dft-proto.html smoke-out/TDM.excellecu smoke-out

      - name: Validar el VST3 con pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pv.zip
          xvfb-run -a ./pluginval --strictness-level 5 --validate-in-process --timeout-ms 120000 \
            "build/Excellecu_artefacts/Release/VST3/Excellecu.vst3"

      - name: Subir capturas de la prueba (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz
          path: smoke-out/*.png

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          A="build/Excellecu_artefacts/Release"
          mkdir -p "dist/Excellecu"
          cp -r "$A/VST3/Excellecu.vst3" "dist/Excellecu/"
          cp packaging/LEEME-Windows.txt "dist/Excellecu/LEEME.txt"
          cd dist && 7z a -tzip ../Excellecu-Windows.zip "Excellecu"

      - name: Comprobar versión mínima de macOS
        if: runner.os == 'macOS'
        run: |
          A="build/Excellecu_artefacts/Release"
          for bin in "$A/VST3/Excellecu.vst3/Contents/MacOS/Excellecu" \
                     "$A/AU/Excellecu.component/Contents/MacOS/Excellecu"; do
            echo "== $bin"; lipo -info "$bin"
            for arch in x86_64 arm64; do
              MIN=$(otool -arch $arch -l "$bin" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{g=1} g&&/version/{print $2; exit}')
              echo "   $arch: macOS mínimo $MIN"
              if [ "$arch" = "x86_64" ] && [ "$MIN" != "10.13" ]; then echo "::error::$bin ($arch) exige macOS $MIN"; exit 1; fi
            done
          done
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$A/VST3/Excellecu.vst3/Contents/Info.plist" || true

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          A="build/Excellecu_artefacts/Release"
          mkdir -p "dist/Excellecu"
          cp -R "$A/VST3/Excellecu.vst3" "dist/Excellecu/"
          cp -R "$A/AU/Excellecu.component" "dist/Excellecu/"
          cp packaging/LEEME-Mac.txt "dist/Excellecu/LEEME.txt"
          # firma "ad hoc": sin cuenta de Apple, pero necesaria para que funcione en Mac con chip M
          for b in "dist/Excellecu/"*.vst3 "dist/Excellecu/"*.component; do
            codesign --force --deep --sign - "$b"
          done
          hdiutil create -volname "Excellecu" -srcfolder "dist/Excellecu" -ov -format UDZO Excellecu-macOS.dmg

      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: |
          A="build/Excellecu_artefacts/Release"
          mkdir -p "dist/Excellecu"
          cp -r "$A/VST3/Excellecu.vst3" "dist/Excellecu/"
          tar -czf Excellecu-Linux.tar.gz -C dist "Excellecu"

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: Excellecu-${{ matrix.name }}
          path: |
            Excellecu-Windows.zip
            Excellecu-macOS.dmg
            Excellecu-Linux.tar.gz
          if-no-files-found: error

      - name: Publicar release (al subir una etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Excellecu-Windows.zip
            Excellecu-macOS.dmg
            Excellecu-Linux.tar.gz
